# Keep Wi-Fi power save off on RTL8852BE combo cards.
#
# With Wi-Fi in power save, rtw89's Bluetooth coexistence takes its "Wi-Fi off"
# path and stops scheduling airtime for A2DP, so Bluetooth audio stalls for
# 0.25-1.1 s at a time. See docs/a2dp-analysis.md.
#
# 2 = disable (NM_SETTING_WIRELESS_POWERSAVE_DISABLE)
[connection]
wifi.powersave = 2
